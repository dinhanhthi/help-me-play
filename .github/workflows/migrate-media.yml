name: Migrate media to Cloudinary

on:
  # Auto-trigger when data files change on main
  push:
    branches: [main]
    paths: ["data/**"]

  # Manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no actual upload)"
        required: false
        default: "false"
        type: boolean

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install gifsicle
        run: sudo apt-get install -y gifsicle

      - name: Run migration script
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/migrate-media-to-cloudinary.mjs --dry-run
          else
            node scripts/migrate-media-to-cloudinary.mjs
          fi

      - name: Commit and push changes
        if: inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: migrate media URLs to Cloudinary

          Uploaded external media assets to Cloudinary and preserved
          original URLs in sourceUrl field for attribution."
            git push
          fi
